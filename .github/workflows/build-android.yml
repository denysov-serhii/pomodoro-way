name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Create eas.json if not exists
        run: |
          if [ ! -f eas.json ]; then
            cat > eas.json << 'EOF'
          {
            "cli": {
              "version": ">= 5.2.0"
            },
            "build": {
              "development": {
                "developmentClient": true,
                "distribution": "internal"
              },
              "preview": {
                "distribution": "internal",
                "android": {
                  "buildType": "apk"
                }
              },
              "production": {
                "android": {
                  "buildType": "apk"
                }
              }
            },
            "submit": {
              "production": {}
            }
          }
          EOF
          fi

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build info
        run: |
          echo "✅ Build submitted to EAS"
          echo "📱 You can check the build status at: https://expo.dev"
          echo "⚙️ To download the APK, visit your Expo dashboard"
          echo ""
          echo "Note: This workflow submits the build to Expo's cloud service."
          echo "The actual build happens on Expo's servers and may take several minutes."
          echo "You'll receive the APK link via email or in your Expo dashboard."
